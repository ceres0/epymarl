# Modified from EPyMARL for OA-QMIX and opponent-profile research.
# --- Opponent-aware QMIX / MAGPIE critic parameters ---

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

runner: "episode"
buffer_size: 5000
target_update_interval_or_tau: 200

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

standardise_returns: False
standardise_rewards: True

agent_output_type: "q"
learner: "q_learner"
double_q: True
mixer: "oa_qmix"
use_rnn: False
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

name: "oa_qmix"

card:
  opponent:
    enabled: True
    profile:
      enabled: True
      mode: "heuristic"
      vector_dim: 8
    critic:
      enabled: True
      inject_to: "mixer"
    aux:
      enabled: False
      loss_weight: 0.0
